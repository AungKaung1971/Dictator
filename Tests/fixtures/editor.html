<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Dictator browser test</title>
<style>body{font:16px system-ui;margin:48px auto;max-width:700px;padding:0 24px;color:#17202a;background:#fafafa}h1{font-size:28px}label{display:block;font-weight:600;margin-top:28px}textarea,input,[contenteditable]{display:block;box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border:1px solid #aaa;border-radius:8px;background:white;font:18px system-ui}textarea,[contenteditable]{min-height:110px}p{color:#555;line-height:1.6}</style>
<h1>Dictator browser test</h1><p>This local page sends no requests and submits nothing. It is only a disposable typing surface.</p>
<label for="dictation">Standard text area</label><textarea id="dictation" placeholder="Click here, hold Fn, speak, then release."></textarea>
<label id="rich-label">Rich text editor</label><div contenteditable="true" role="textbox" aria-labelledby="rich-label" aria-multiline="true"></div>
<label for="password">Password — dictation should be blocked</label><input type="password" id="password" autocomplete="off" placeholder="Leave empty; do not enter a real password.">
</html>
